name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on Cargo.lock; rusqlite's bundled SQLite is a C build that costs
      # a couple of minutes when it is not cached.
      - uses: Swatinem/rust-cache@v2

      # The hook goes first: tauri-build resolves bundle.externalBin while compiling
      # the app, and that path is the hook under its target-triple name, so building
      # the whole workspace in one go fails on a clean checkout.
      - name: Build the hook
        run: cargo build --release --locked -p codenotch-hook

      - name: Name the hook for externalBin
        run: copy target\release\codenotch-hook.exe target\release\codenotch-hook-x86_64-pc-windows-msvc.exe

      # No clippy gate on top: this tree is upstream code, and failing the build
      # on its lints would only produce red crosses nobody here is going to fix.
      - name: Build the app
        run: cargo build --release --locked
