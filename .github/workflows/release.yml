name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Build NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The hook has to exist before the app is compiled: tauri-build resolves
      # bundle.externalBin at build time and fails when the file is missing. Its
      # target-triple name is what makes the installer drop codenotch-hook.exe next
      # to codenotch.exe — exactly where hooks_install.rs looks for it.
      - name: Build the hook
        run: cargo build --release --locked -p codenotch-hook

      - name: Name the hook for externalBin
        run: copy target\release\codenotch-hook.exe target\release\codenotch-hook-x86_64-pc-windows-msvc.exe

      - name: Bundle
        run: cargo tauri build
        working-directory: codenotch
        env:
          # Signs the updater artifact. Without these the build still produces an installer, but no
          # .sig, and the latest.json step below fails rather than shipping an unverifiable update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The update feed the installed app polls. Its version has to match the tag, which is what
      # makes an installed 0.5.1 see 0.5.2 and take it.
      - name: Write latest.json
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls target/release/bundle/nsis/*-setup.nsis.zip)
          ver="${GITHUB_REF_NAME#v}"
          # The .sig is one line of base64, so it drops into JSON without escaping
          cat > latest.json <<JSON
          {"version":"$ver",
           "pub_date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
           "platforms":{"windows-x86_64":{
             "signature":"$(cat "$zip.sig")",
             "url":"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"}}}
          JSON
          cat latest.json

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*-setup.nsis.zip
            target/release/bundle/nsis/*-setup.nsis.zip.sig
            latest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
